services:
  plex-mcp:
    image: ghcr.io/carldog/plex-mcp:latest
    pull_policy: always
    container_name: plex-mcp
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      MCP_PORT: "3000"
      PLEX_URL: "${PLEX_URL}"
      PLEX_TOKEN: "${PLEX_TOKEN}"
      # Optional Tautulli statistics integration. Empty URL/key disables all
      # outbound Tautulli calls while keeping the four plex_tautulli_* tools
      # registered with clear availability diagnostics.
      TAUTULLI_URL: "${TAUTULLI_URL:-}"
      TAUTULLI_API_KEY: "${TAUTULLI_API_KEY:-}"
      TAUTULLI_TIMEOUT_MS: "${TAUTULLI_TIMEOUT_MS:-10000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Required in HTTP mode (MCP-F03): comma-separated Host header
      # hostnames this server accepts on /mcp. Bare hostnames only, no
      # ports — matching is hostname-only and port-independent (aligned
      # 2026-08-30 with the rest of the fleet). Fleet-canonical value:
      # localhost,127.0.0.1,[::1],your-nas,host.docker.internal — add
      # host.docker.internal if a sibling MCP container on this host needs
      # to call in too. A host:port entry still works (the port is simply
      # ignored) so an old-style value keeps matching unchanged. Set
      # explicitly in the stack's environment variables, same as
      # PLEX_URL/PLEX_TOKEN/HOST_IMAGE_DIR — this is a security allowlist,
      # not a harmless convenience default, so it stays fully
      # operator-controlled rather than partially templated here. Defends
      # against DNS rebinding: without this, a page loaded in a LAN browser
      # could rebind its own hostname to this container's IP and drive
      # tools (including writes) as a confused deputy — "LAN only, no
      # auth" is not a real boundary against that attack shape. The server
      # refuses to start in HTTP mode without it.
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?MCP_ALLOWED_HOSTS must be set, e.g. localhost,127.0.0.1,[::1],your-nas,host.docker.internal — see docker-deployments.md rule #8}"
      # Optional: comma-separated Origin header values to accept. Leave
      # unset (default) unless a browser-based client legitimately needs to
      # call this server directly — non-browser clients (the mcp-remote
      # bridge, a direct fetch) never send an Origin header at all, so the
      # empty default rejects only the request shape a DNS-rebinding
      # attack actually sends.
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      # Optional: evict an MCP session after this many idle milliseconds
      # (no activity, not total lifetime). Default 30 min, matching every
      # other fleet MCP server (renamed from MCP_SESSION_IDLE_TIMEOUT_MS,
      # default was 1h, 2026-08-30). Guards against sessions leaking
      # forever when a client disappears uncleanly.
      MCP_SESSION_IDLE_MS: "${MCP_SESSION_IDLE_MS:-1800000}"
      # Optional: timeout in milliseconds for every outbound request to
      # Plex (MCP-F01). A hung or half-open Plex server would otherwise
      # block a tool call indefinitely. Default 30s.
      MCP_FETCH_TIMEOUT_MS: "${MCP_FETCH_TIMEOUT_MS:-30000}"
      # Optional: size cap and fetch timeout for plex_download_logs. A
      # log ZIP bundle has a different size/latency profile than an
      # image — separate defaults from MCP_IMAGE_MAX_BYTES /
      # MCP_FETCH_TIMEOUT_MS above (50 MiB, 2 min vs 4 MiB, 30s).
      MCP_LOG_MAX_BYTES: "${MCP_LOG_MAX_BYTES:-52428800}"
      MCP_LOG_FETCH_TIMEOUT_MS: "${MCP_LOG_FETCH_TIMEOUT_MS:-120000}"
      # Read-only Plex host-package log source used only when the Plex
      # diagnostics API returns 5xx or cannot be reached.
      MCP_PLEX_LOG_SOURCE_DIR: "${MCP_PLEX_LOG_SOURCE_DIR:-/plex-logs}"
      # Optional HTTPS — pick ONE of the two modes below.
      #
      # (a) Self-managed cert (recommended for LAN-only deployment):
      #     MCP_TLS: "auto"
      #     MCP_TLS_DIR: "/data/certs"              # mount a volume here to persist
      #     MCP_TLS_SAN: "DNS:your-nas,IP:127.0.0.1"
      #     MCP_TLS_CN: "your-nas"               # optional; defaults to first DNS SAN
      #     MCP_TLS_DAYS: "365"                     # optional; rotates when <30 days remain
      #
      # (b) Bring-your-own cert (Let's Encrypt, internal CA, etc.):
      #     MCP_TLS_CERT_FILE: "/certs/fullchain.pem"
      #     MCP_TLS_KEY_FILE:  "/certs/privkey.pem"
      #
      # When TLS is on, switch the healthcheck below to wget --no-check-certificate
      # against https://localhost:3000/health.
    volumes:
      # plex_save_image output directory. Files written under
      # /data/images inside the container land at HOST_IMAGE_DIR on
      # the host — set it to /volume1/Media/_mcp-scratch to match
      # filesystem-mcp's exposed /media/_mcp-scratch, closing the loop
      # for the plex_search → plex_save_image → filesystem-mcp
      # pipeline. Required, absolute path only — a relative default
      # here resolves inside whatever directory Portainer cloned the
      # git stack into for that redeploy, which doesn't exist next
      # time; Docker then refuses the bind mount and the container is
      # stuck in `created` forever. Took the deployed stack down ~10h
      # on 2026-07-31 (see docker-deployments.md rule #10 and fleet
      # lesson 2026-07-31-relative-compose-volume-defaults-break-
      # portainer-git-stacks). Override the in-container path with
      # MCP_IMAGE_SAVE_DIR if you want it elsewhere.
      - "${HOST_IMAGE_DIR:?HOST_IMAGE_DIR must be set to an absolute host path, e.g. /volume1/Media/_mcp-scratch — a relative default breaks Portainer git-stack redeploys, see docker-deployments.md rule #10}:/data/images"
      # plex_download_logs output directory. Separate from
      # HOST_IMAGE_DIR above — a diagnostic log ZIP isn't a media
      # artifact, and keeping the two apart avoids mixing them in
      # one host directory or one filesystem-mcp-exposed path.
      # Required, absolute path only — same relative-default trap as
      # HOST_IMAGE_DIR above. Override the in-container path with
      # MCP_LOG_SAVE_DIR if you want it elsewhere.
      - "${HOST_LOG_DIR:?HOST_LOG_DIR must be set to an absolute host path, e.g. /volume1/docker/plex-mcp/logs — a relative default breaks Portainer git-stack redeploys, see docker-deployments.md rule #10}:/data/logs"
      # Direct diagnostic fallback source. Required and read-only so a
      # wedged Plex HTTP API cannot prevent retrieval of its primary log.
      - "${HOST_PLEX_LOG_SOURCE_DIR:?HOST_PLEX_LOG_SOURCE_DIR must be set to Plex's absolute Logs directory, e.g. /volume1/docker/plex/Library/Application Support/Plex Media Server/Logs}:/plex-logs:ro"
      # Optional HTTPS cert volume (commented). Self-managed persists
      # across restarts; BYO is read-only.
      # - ./certs:/data/certs
      # - ./certs:/certs:ro
    extra_hosts:
      # Lets the container reach Plex when it's running on the same host.
      # Use PLEX_URL=http://host.docker.internal:32400 in that case.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      # Cap container log size and rotate. With max-size=10m and
      # max-file=3, total log usage stays under ~30MB; oldest files are
      # automatically deleted when the limit is hit. Logs themselves go
      # to stderr (per the application's logging convention) and Docker
      # captures them via the json-file driver.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
